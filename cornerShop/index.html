<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corner Shop: Idle TV Window</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--or:#ff7a1a;--ye:#ffd400;--ink:#000;--dim:#8a7a2a;--gr:#5ac85a;--pu:#8e44ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:"Press Start 2P",ui-monospace,monospace;overflow:hidden;touch-action:manipulation;user-select:none}
#g{position:relative;display:flex;gap:6px;height:100%;padding:6px;justify-content:center}
canvas{height:100%;max-width:calc(100vw - 96px);aspect-ratio:200/340;image-rendering:auto;border:3px solid var(--or);background:#000}
#col{display:flex;flex-direction:column;gap:6px;width:76px;z-index:6;position:relative}
#coins{border:3px solid var(--ye);color:var(--ye);font-size:8px;padding:10px 2px;text-align:center;background:#000;flex:1 1 100%;min-width:0}#top{display:flex;gap:4px;flex-wrap:wrap}#idx,#setb{flex:1;height:26px;font:inherit;font-size:12px;background:var(--ye);border:3px solid #000;outline:2px solid var(--ye);cursor:pointer;padding:0}
.u{position:relative;flex:1 1 0;min-height:0;max-height:70px;background:var(--ye);color:var(--ink);border:3px solid #000;outline:2px solid var(--ye);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px 5px;font:inherit;cursor:pointer;overflow:hidden}
.u .ic{font-size:18px;line-height:1.1}
.u .pips{display:flex;gap:2px;min-height:5px;font-size:6px}
.u .pip{width:5px;height:5px;background:#000}.u .pip.e{background:rgba(0,0,0,.25)}
.u .cost{font-size:7px}
.u.no{background:var(--dim);outline-color:var(--dim)}
.u.no::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:var(--ye)}
.u.lock{background:#2a2a2a;color:#777;outline-color:#2a2a2a;justify-content:center}.u .ic svg{display:block}
.u.max{background:var(--gr);outline-color:var(--gr)}
.u.best{outline-color:#fff}
.u.sel{filter:none}
#card{position:absolute;right:100%;width:210px;background:var(--ye);color:#000;border:3px solid #000;border-right:0;box-shadow:0 -2px 0 var(--ye),0 2px 0 var(--ye),-2px 0 0 var(--ye);padding:6px 8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 8px;z-index:5;transform:scaleX(0);transform-origin:100% 50%;opacity:0;pointer-events:none;transition:transform .2s steps(5),opacity .2s}
#card.open{transform:none;opacity:1;pointer-events:auto}
#card h3{font-size:8px;margin:0;grid-column:1}#cl{display:none}#cd{font-size:6px;grid-column:1;opacity:.75}
#card .eff{margin:0;font-size:7px;grid-column:1}
#buy{grid-column:2;grid-row:1/4;width:auto;margin:0;padding:10px 6px;font:inherit;font-size:8px;background:var(--gr);border:3px solid #000;cursor:pointer;color:#000}
#buy:disabled{background:#999;cursor:default}#card.info #buy,#card.info #buy:disabled{pointer-events:none;background:none;border:0;padding:0;font-size:8px}
#dev{position:fixed;left:6px;bottom:34px;z-index:20;display:none;background:rgba(0,0,0,.92);border:2px solid var(--ye);padding:6px;max-width:230px;font-size:7px;line-height:1.6}#dev button,#dev select{font:inherit;font-size:7px;margin:2px;padding:5px 4px;background:var(--ye);color:#000;border:2px solid #000;cursor:pointer}#devb{position:fixed;left:6px;bottom:6px;z-index:21;font:inherit;font-size:7px;padding:5px 6px;background:#222;color:#ffd400;border:2px solid #444;opacity:.55;cursor:pointer}
#set{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8)}#setbox{background:#111;border:3px solid var(--ye);padding:12px;display:flex;flex-direction:column;gap:8px;width:min(86vw,300px)}#setbox button{font:inherit;font-size:8px;padding:10px 8px;background:var(--ye);color:#000;border:3px solid #000;cursor:pointer;text-align:left}.u .nm{display:none;font-size:5px;order:1}.u .ic{order:0}.u .pips{order:2}.u .cost{order:3}body.lab .u .nm{display:block}body.lab .u .ic{font-size:14px}
.bar{display:block;width:46px;height:5px;background:rgba(0,0,0,.25)}.bar b{display:block;height:5px;background:#000}.pips.t{gap:1px}.pips.t .pip{width:4px;height:4px}
@media (prefers-reduced-motion:reduce){.u.best{animation:none}#card{transition:none}}
</style></head><body>
<div id="g"><canvas id="c" width="600" height="1020"></canvas>

<div id="card"><h3 id="cn"></h3><div id="cd"></div><div class="eff" id="ce"></div><div id="cl"></div><button id="buy">BUY</button></div></div>
