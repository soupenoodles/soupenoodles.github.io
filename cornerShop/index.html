/* ================ TRACKER: playtest telemetry (defined first so every section can log) ================ */
const Tracker=(()=>{

function cappedUpgradeCostReport(){

  const scale=1;

    ['Speed',1,1.55,20],['Corner zone',3,1.65,10],['Crowd',4,1.65,10],
    ['Attention',6,1.7,10],['Lucky',50,1.8,10],
    ['Magnet',30,1.6,15],['Showroom',100,1.7,20],['Price tag',500,2,10],['Restock',200,1.8,15]
  ];
  const rows=defs.map(([name,base,mult,max])=>{let total=0;const startLevel=currentShop*max;for(let level=0;level<max;level++)total+=roundPrice(base*mult**(startLevel+level)*scale);return {name,total}});
  let tvGradeTotal=0;const tvGradeStart=Array.from({length:currentShop},(_,i)=>upgradeMax('start',i)).reduce((a,b)=>a+b,0);for(let level=0;level<upgradeMax('start',currentShop);level++)tvGradeTotal+=roundPrice(UPGRADE_BASE.start*TV_GRADE_PRICE_MULT**(tvGradeStart+level));rows.push({name:'TV grade',total:tvGradeTotal});

}

/* SAVE / LOAD: keys cornerShopSave, cornerShopGoals, cornerShopOff (final names, with sv = SAVE_VERSION). Old P2Test keys are copied once by migrateAll(), never changed. */
function saveGame(){if(resetting||!booted)return;try{PS.set(KEY_SAVE,JSON.stringify({sv:SAVE_VERSION,v:VERSION,coins,corners,sc:currentShop,S:shopState,P:prestigeData,badge,seen:UPGRADES.map(u=>!!u.seen),s1end:season1End,life:LIFE,fx:fxSeen.map(Boolean),ih:idxHint,shops:shops.map(s=>({tvs:s.tvs.map(v=>v.t),bought:s.bought,merges:s.merges||0,tm:s.tierMerges||{},fit:s.fit,upgrades:s.upgrades||{}})).concat(SEASON2_RELEASED?[]:extraShops)}))}catch(e){}}
function loadGame(){
 let d=null;try{d=upgradeSave(JSON.parse(PS.get(KEY_SAVE)||'null'))}catch(e){}
 if(!d||typeof d!=='object')return;
 try{
  const ns=Array.isArray(d.shops)?d.shops.slice(0,SHOPS.length).map((s,shopIndex)=>({people:makePeople(),tvs:(Array.isArray(s.tvs)?s.tvs:[]).slice(0,slots()).map(t=>makeTV(Math.max(0,Math.min(TV_TYPES.length-1,t|0)))),bought:+s.bought||0,merges:+s.merges||0,tierMerges:(s.tm&&typeof s.tm==='object')?s.tm:{},fit:+s.fit||0,upgrades:s.upgrades&&typeof s.upgrades==='object'?Object.fromEntries(Object.keys(UPGRADE_MAX).map(k=>[k,Math.max(0,Math.min(upgradeMax(k,shopIndex),Number(s.upgrades[k])||0))])):{}})):[];
  if(ns.length){shops.length=0;ns.slice(0,SHOP_CAP()).forEach(s=>shops.push(s));extraShops=ns.slice(SHOP_CAP()).map(s=>({tvs:s.tvs.map(v=>v.t),bought:s.bought,merges:s.merges||0,tm:s.tierMerges||{},fit:s.fit,upgrades:s.upgrades||{}}))}
  coins=+d.coins||0;corners=+d.corners||0;
  if(d.P&&typeof d.P==='object'){['points','spent','claimedScore','lifetimeEarned','runEarned','prestiges','bestShop'].forEach(k=>{if(Number.isFinite(+d.P[k]))prestigeData[k]=Math.max(0,+d.P[k])});if(d.P.skills&&typeof d.P.skills==='object')SKILLS.forEach(sk=>{prestigeData.skills[sk.id]=Math.max(0,Math.min(sk.max,+d.P.skills[sk.id]||0))})}else prestigeData.bestShop=Math.max(prestigeData.bestShop,shops.length-1);
  if(d.S&&typeof d.S==='object'){
   Object.keys(shopState).forEach(k=>{if(k!=='un'&&!Object.prototype.hasOwnProperty.call(UPGRADE_MAX,k)&&typeof d.S[k]==='number')shopState[k]=d.S[k]});
   shopState.un=Array.isArray(d.S.un)?d.S.un.map(Boolean):[true];shopState.un[0]=true;
   const hasShopUpgradeData=ns.some(x=>Object.keys(x.upgrades||{}).length>0);
   if(!hasShopUpgradeData)Object.keys(UPGRADE_MAX).forEach(k=>{shops[0].upgrades[k]=Math.max(0,Math.min(upgradeMax(k,0),Number(d.S[k])||0))});
  }
  currentShop=Math.max(0,Math.min(shops.length-1,d.sc|0));shops.forEach(sh=>{sh.people=sh.people||makePeople()});currentTVs=shops[currentShop].tvs;people=shops[currentShop].people;prestigeData.bestShop=Math.min(Math.max(prestigeData.bestShop,shops.length-1),SHOP_CAP()-1);
  if(Array.isArray(d.badge))d.badge.forEach((b,i)=>{if(i<badge.length)badge[i]=!!b});
  if(Array.isArray(d.seen))d.seen.forEach((v,i)=>{if(v&&UPGRADES[i])UPGRADES[i].seen=true});fxSeen=Array.isArray(d.fx)?d.fx.map(Boolean):shopState.un.slice();fxSeen[0]=true;idxHint=d.ih!==undefined?(d.ih|0):(shopState.un[1]?2:0);try{document.getElementById('idx').classList.toggle('idxglow',idxHint===1)}catch(e){}season1End=!!d.s1end;LIFE=Object.assign(LIFE_ZERO(),d.life&&typeof d.life==='object'?d.life:{});for(const k in LIFE)LIFE[k]=Math.max(0,+LIFE[k]||0);/* old saves: zeros */
  displayCoins=coins}catch(e){}}
let acc=0;setInterval(refresh,200);
let t0=performance.now(); 
let dex=false,dexPage=0,coins=0,displayCoins=0,cps=0,cpsTimer=0,lastCoins=0,lastBounceVal=0,lastCornerVal=0;
let savedT=0,resetting=false;
let tabT=0,tapBoost=0,selectedTV=null,corners=0,shake=0,pulseT=0,pulseOn=false,floats=[],toast='',toastT=0;
/* ================ 10. PHASE 1 FEATURES: counter swap, Sale boost, era marks ================ */

/* ================ 11. GOALS AND OFFLINE EARNINGS (v1.9.0) ================ */
const GOALS=[
 {t:'Tap the TV 10 times',p:()=>[GS.taps,10]},
 {t:'Buy your second TV',p:()=>[shops[0].bought,2],r:1},
 {t:'Hit your first corner',p:()=>[corners,1]},
 {t:'Merge two TVs into a Color set',p:()=>[shopMergeCount(0),1],r:1},
 {t:'Own 3 TVs',p:()=>[shops[0].tvs.length,3]},
 {t:'Get your first notice',p:()=>[GS.notices,1]},
 {t:'Reach Speed level 8',p:()=>[localUpgradeLevel('speed',0),8]},
 {t:'Hit 5 corners',p:()=>[corners,5],r:1},
 {t:'Earn 2,500 coins in total',p:()=>[prestigeData.runEarned,2500],n:1},
 {t:'Buy TV Grade',p:()=>[localUpgradeLevel('start',0),1]},
 {t:'Own 3 different TV tiers',p:()=>[new Set(shops[0].tvs.map(v=>v.t)).size,3]},
 {t:'Hit a corner during a notice (x2)',p:()=>[GS.x2,1],r:1},
 {t:'Own a Console TV',p:()=>[shops[0].tvs.some(v=>v.t>=2)?1:0,1],r:1},
 {t:'Buy the first TV of shop 1',p:()=>[shops.length>1&&shops[1].bought>0?1:0,1],wall:1}
];
function shopBonus(){let n=0;for(let i=1;i<shops.length;i++)if(shops[i].bought>0)n++;return 1+.25*n}
function firstTVTier(){const b=Math.min(TV_TYPES.length-1,shopState.start);return(currentShop>0&&shops[currentShop].bought===0)?Math.min(TV_TYPES.length-1,Math.max(b,SHOPS[currentShop].eraMax-1)):b}
let mergePick=null;
function mergeCostNow(t){const sh=shops[currentShop],L=shopState.mergeDisc||0,rep=(sh.tierMerges&&sh.tierMerges[t])||0;return roundPrice(mergeTierBase(currentShop,t)*MERGE_REPEAT**rep*Math.pow(MERGE_STEP_ABOVE_ERA,Math.max(0,t+1-SHOPS[currentShop].eraMax))*Math.max(.4,(1-.1*L)*Math.max(.6,1-.08*skillLevel('merge'))))}
function tryMerge(){if(!selectedTV)return;const k=currentTVs.indexOf(selectedTV),t=selectedTV.t,pt=[];currentTVs.forEach((v,i)=>{if(i!==k&&v.t===t)pt.push(i)});
 if(!pt.length||t>=TV_TYPES.length-1){toast='NO MATCH TO MERGE';toastT=1.5;return}
 const c=mergeCostNow(t);if(coins<c){toast='NEED '+formatNumber(c)+' TO MERGE';toastT=1.5;return}
 if(pt.length===1){mergeTVs(k,pt[0]);return}
 mergePick={src:k,partners:pt};selectedTV=null;toast='TAP THE TV TO MERGE WITH';toastT=2.5}
function mergeTVs(i,j){const a=Math.min(i,j),b=Math.max(i,j),t=currentTVs[a].t,c=mergeCostNow(t);if(coins<c)return;coins-=c;
 currentTVs=currentTVs.filter((_,x)=>x!==a&&x!==b);currentTVs.splice(a,0,makeTV(t+1));selectedTV=null;mergePick=null;shops[currentShop].tvs=currentTVs;if(t+1>LIFE.bestTier)LIFE.bestTier=t+1;LIFE.merges++;shopState.merges++;shops[currentShop].merges=(shops[currentShop].merges||0)+1;{const tm=shops[currentShop].tierMerges||(shops[currentShop].tierMerges={});tm[t]=(tm[t]||0)+1}
 if(!shopState.un[t+1]){shopState.un[t+1]=true;toast='NEW TV: '+TV_TYPES[t+1].n+'!';toastT=3}tierUnlockFx(t+1);Tracker.ev('merge',{t,c:Math.round(c),shop:currentShop})}
let goalIdx=0;function loadAux(){try{const d=upgradeSave(JSON.parse(PS.get(KEY_GOALS)||'null'));if(d){goalIdx=d.i||0;if(d.gs)Object.assign(GS,d.gs)}}catch(e){}try{const o=upgradeSave(JSON.parse(PS.get(KEY_OFF)||'null'));if(o){idleRate=o.rate||0;setTimeout(()=>applyOffline((Date.now()-o.t)/1000),500)}}catch(e){}}
let idleRate=0,lastRE=0,lastIn2=Date.now(),hiddenAt=0;
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{lastIn2=Date.now()},true));
function placeGoal(){try{const r=C.getBoundingClientRect();gEl.style.left=(r.left+r.width/2)+'px';gEl.style.top=(r.top+10)+'px';gEl.style.width=Math.min(300,r.width-30)+'px'}catch(e){}}
addEventListener('resize',()=>placeGoal());
const gEl=document.createElement('div');gEl.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(300px,62vw);padding:6px 8px;background:rgba(10,10,14,.92);border:2px solid #f4d35e;color:#fff;font:7px "Press Start 2P",monospace;z-index:9000;cursor:pointer;text-align:center';document.body.appendChild(gEl);
function goalInfo(){const g=GOALS[goalIdx];if(!g)return null;let [c,m]=g.p();if(g.wall&&!(shops.length>1&&shops[1].bought>0)){m=SHOPS[1].firstTV;c=Math.min(coins,m)}return{g,c,m,done:g.wall?(shops.length>1&&shops[1].bought>0):c>=m}}
function goalReward(){return Math.max(5,20*Math.max(idleRate,.1))}
function claimGoal(){const i=goalInfo();if(!i||!i.done)return;let x=0;if(i.g.r){x=goalReward();gainCoins(x);lastRE+=x;toast='GOAL +'+formatNumber(x);toastT=1.5}Tracker.ev('goal',{n:goalIdx+1,name:i.g.t,reward:Math.round(x)});goalIdx++;saveGoals()}
gEl.onclick=claimGoal;
function saveGoals(){if(resetting||!booted)return;try{PS.set(KEY_GOALS,JSON.stringify({sv:SAVE_VERSION,i:goalIdx,gs:GS}))}catch(e){}}
function showOffline(sec,gain){let d=document.getElementById('offv');if(d)d.remove();d=document.createElement('div');d.id='offv';d.style.cssText='position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center';
 const b=document.createElement('div');b.style.cssText='background:#14141c;border:3px solid #f4d35e;padding:18px;color:#fff;font:9px "Press Start 2P",monospace;text-align:center;line-height:1.8;max-width:80vw';
 const m=Math.round(sec/60);b.innerHTML='WELCOME BACK<br>Away '+(m>=60?(m/60).toFixed(1)+' h':m+' min')+'<br>Your shops earned<br><span style="color:#f4d35e;font-size:12px">+'+formatNumber(gain)+'</span><br><span style="font-size:6px;color:#aaa">30% of idle income, up to 3 hours</span><br><br>';
 const k=document.createElement('button');k.textContent='OK';k.style.cssText='font:9px "Press Start 2P",monospace;padding:8px 18px;background:#f4d35e;border:2px solid #000;cursor:pointer';k.onclick=()=>d.remove();b.appendChild(k);d.appendChild(b);document.body.appendChild(d)}
function applyOffline(sec){if(!(sec>=30))return;sec=Math.min(sec,10800);if(!(idleRate>0))return;const gain=.3*idleRate*sec;gainCoins(gain);lastRE+=gain;Tracker.ev('offline',{sec:Math.round(sec),gain:Math.round(gain)});showOffline(sec,gain)}
function saveSeen(){if(resetting||!booted)return;try{PS.set(KEY_OFF,JSON.stringify({sv:SAVE_VERSION,t:Date.now(),rate:idleRate}))}catch(e){}}

document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();saveSeen()}else if(hiddenAt){const s=(Date.now()-hiddenAt)/1000;hiddenAt=0;applyOffline(s);saveSeen()}});
addEventListener('pagehide',()=>{saveSeen();saveGoals()});
let gt=0;setInterval(()=>{gt++;try{gEl.style.display=selectedTV?'none':'';const d=prestigeData.runEarned-lastRE;lastRE=prestigeData.runEarned;if(!document.hidden&&Date.now()-lastIn2>10000&&d>=0)idleRate=idleRate?idleRate*.9+d*.1:d;
 const i=goalInfo();if(!i){gEl.innerHTML='GOALS COMPLETE<br><span style="color:#aaa">More goals soon</span>'}else{const pct=Math.min(100,100*i.c/Math.max(1e-9,i.m));gEl.innerHTML='GOAL '+(goalIdx+1)+'/'+GOALS.length+'<br>'+i.g.t+'<br><div style="height:5px;background:#333;margin:4px 0"><div style="height:5px;width:'+pct+'%;background:'+(i.done?'#6f6':'#f4d35e')+'"></div></div>'+(i.done?'<span style="color:#6f6">TAP TO CLAIM'+(i.g.r?' +'+formatNumber(goalReward()):'')+'</span>':formatNumber(i.c)+' / '+formatNumber(i.m)+(i.g.r?'<br><span style="color:#aaa;font-size:6px">REWARD +'+formatNumber(goalReward())+'</span>':''))}
 try{gEl.classList.toggle('goalglow',!!(i&&i.done));placeGoal();prestigeOpen.className=prestigeGain()>0?'ready':''}catch(e){}
 if(gt%5===0){saveSeen();saveGoals()}}catch(e){}},1000);

Tracker.install();
/* PHASE 1 TEST: counter swap cooldown, Sale boost, era marks (simple shapes) */
let swapFree=3,swapN=0,swapReady=0,swapLast=0;
function swapLabel(){const n=Date.now()/1000;return(swapFree<=0&&n<swapReady)?'WAIT '+Math.ceil(swapReady-n)+'s':'TO COUNTER'}
function trySwap(k){const n=Date.now()/1000;if(n-swapLast>300)swapN=0;if(swapFree<=0&&n<swapReady){Tracker.ev('swap_blocked');toast='SWAP COOLDOWN '+Math.ceil(swapReady-n)+'s';toastT=2;return}
 if(swapFree>0){swapFree--;if(swapFree===0){swapN=1;swapReady=n+30}}else{swapN++;swapReady=n+Math.min(300,30*2**(swapN-1))}swapLast=n;Tracker.ev('swap',{free:swapFree,n:swapN});[currentTVs[0],currentTVs[k]]=[currentTVs[k],currentTVs[0]]}
let saleUntil=0,saleCD=0,saleTap=0;
function saleActive(){return Date.now()/1000<saleUntil}
function saleStart(){const n=Date.now()/1000;if(saleActive()||n<saleCD)return;saleUntil=n+30;saleCD=n+330;saleTap=0;Tracker.ev('sale_start',{shop:currentShop})}
/* v1.9.9.5: START SALE button removed. saleStart() is kept but nothing calls it. */
/* v1.9.9.1: the bouncing mark follows the TV tier (t), not the shop. If a logo colour is set in the SCREEN panel, c is that colour. */
function eraMark(c,x,y,w,h,t){const k=t===undefined?currentShop:t,d='rgba(0,0,0,.55)',g=canvasCtx,cx=x+w/2,cy=y+h/2,ov=!!(DEBUG.logoCfg[k]&&DEBUG.logoCfg[k].color);
 if(k===0){/* B/W set: signal dot */g.fillStyle=c;g.beginPath();g.arc(cx,cy,Math.min(w,h)*.4,0,7);g.fill();drawRect(d,cx-.5,cy-.5,1,1)}
 else if(k===1){/* colour set: red, green and blue dots */const r=Math.min(w,h)*.27;[[x+w*.28,y+h*.32,'#ff3b3b'],[x+w*.72,y+h*.32,'#3bff6a'],[cx,y+h*.74,'#3b7bff']].forEach(a=>{g.fillStyle=ov?c:a[2];g.beginPath();g.arc(a[0],a[1],r,0,7);g.fill()})}
 else if(k===2){/* console TV: channel number box */drawRect(c,x,y,w,h);drawRect(d,x+w*.2,y+2,2,h-4);drawRect(d,x+w*.5,y+2,2,h-4);drawRect(d,x+w*.78,y+2,1,h-4)}
 else if(k===3){/* portable: rabbit-ear antenna */g.strokeStyle=c;g.lineWidth=Math.max(1.4,h*.16);g.lineCap='round';g.beginPath();g.moveTo(cx,y+h);g.lineTo(x+w*.2,y+1);g.moveTo(cx,y+h);g.lineTo(x+w*.8,y+1);g.stroke();g.fillStyle=c;g.beginPath();g.arc(cx,y+h-1,Math.max(1.4,h*.15),0,7);g.fill();g.lineCap='butt'}
 else if(k===4){/* remote CRT: power button */g.strokeStyle=c;g.lineWidth=Math.max(1.3,h*.17);g.beginPath();g.arc(cx,cy+.5,h*.38,-Math.PI/2+.65,-Math.PI/2-.65+Math.PI*2);g.stroke();g.beginPath();g.moveTo(cx,y);g.lineTo(cx,cy);g.stroke()}
 else if(k===5){/* stereo CRT: sound bars */[.5,1,.7,.35].forEach((f,i)=>{const bh=Math.max(2,h*f);drawRect(c,x+w*.1+i*w*.22,y+h-bh,Math.max(2,w*.16),bh)})}
 else if(k===6){/* widescreen CRT: play triangle */g.fillStyle=c;g.beginPath();g.moveTo(x+w*.25,y);g.lineTo(x+w*.25,y+h);g.lineTo(x+w*.82,cy);g.closePath();g.fill()}
 else if(k===7){/* plasma: classic disc */g.fillStyle=c;g.beginPath();g.ellipse(cx,cy,w/2,h/2,0,0,7);g.fill();drawRect(d,cx-2,cy-1,4,2)}
 else if(k===8){/* smart 4K: streaming tile with a play triangle */drawRect(c,x+1,y,w-2,h);drawRect(c,x,y+1,w,h-2);g.fillStyle=d;g.beginPath();g.moveTo(x+w*.4,y+h*.22);g.lineTo(x+w*.4,y+h*.78);g.lineTo(x+w*.68,cy);g.closePath();g.fill()}
 else{drawRect(c,x,y,w,h);drawRect(d,x+3,y+2,2,h>10?6:4);drawRect(d,x+8,y+2,2,h>10?6:4)}}

function boot(){migrateAll();try{localStorage.removeItem('cornerShopP1Log')}catch(e){}loadAux();loadGame();UPGRADES[1].seen=true;
setInterval(()=>{saveGame();savedT=1},30000);addEventListener('beforeunload',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});

(function loop(n){const dt=Math.min(.1,(n-t0)/1000);t0=n;update(dt);render();requestAnimationFrame(loop)})(performance.now());
refresh();
 booted=true;placeGoal();cgDo(S=>S.game.loadingStop());setInterval(cgPlayTick,500);cgPlayTick()}
cgInit().then(()=>{cgDo(S=>S.game.loadingStart());boot()});
