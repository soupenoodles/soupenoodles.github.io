/* AUDIO: context is created on the first pointerdown/keydown (mobile autoplay policy); missing files are skipped silently */
const SFX={bounce:{src:'assets/sfx_bounce.wav',vol:.3,max:3},corner:{src:'assets/sfx_corner.wav',vol:.6},switch:{src:'assets/sfx_switch.wav',vol:.4}},AU={ctx:null,buf:{},n:{}};
function audioInit(){
 if(!CFG.sound)return;
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;AU.ctx=new AC();if(AU.ctx.state==='suspended')AU.ctx.resume();
  Object.keys(SFX).forEach(k=>{fetch(SFX[k].src).then(r=>r.ok?r.arrayBuffer():null).then(b=>b?AU.ctx.decodeAudioData(b):null).then(d=>{if(d)AU.buf[k]=d}).catch(()=>{})})}catch(e){}}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,audioInit,true));
function sfx(k){
 if(!CFG.sound||!AU.ctx||!AU.buf[k])return;const c=SFX[k];if(c.max&&(AU.n[k]||0)>=c.max)return;
 try{const s=AU.ctx.createBufferSource(),g=AU.ctx.createGain();s.buffer=AU.buf[k];g.gain.value=c.vol;s.connect(g);g.connect(AU.ctx.destination);AU.n[k]=(AU.n[k]||0)+1;s.onended=()=>{AU.n[k]=Math.max(0,(AU.n[k]||1)-1)};s.start()}catch(e){}}

function saveGame(){if(resetting)return;try{localStorage.setItem('cornerShopP1Test',JSON.stringify({v:VERSION,coins,corners,sc:currentShop,S:shopState,P:prestigeData,badge,seen:UPGRADES.map(u=>!!u.seen),shops:shops.map(s=>({tvs:s.tvs.map(v=>v.t),bought:s.bought,merges:s.merges||0,fit:s.fit,upgrades:s.upgrades||{}}))}))}catch(e){}}
function loadGame(){
 let d=null;try{d=JSON.parse(localStorage.getItem('cornerShopP1Test')||'null')}catch(e){}
 if(!d||typeof d!=='object')return;
 try{
  const ns=Array.isArray(d.shops)?d.shops.slice(0,SHOPS.length).map((s,shopIndex)=>({people:makePeople(),tvs:(Array.isArray(s.tvs)?s.tvs:[]).slice(0,slots()).map(t=>makeTV(Math.max(0,Math.min(TV_TYPES.length-1,t|0)))),bought:+s.bought||0,merges:+s.merges||0,fit:+s.fit||0,upgrades:s.upgrades&&typeof s.upgrades==='object'?Object.fromEntries(Object.keys(UPGRADE_MAX).map(k=>[k,Math.max(0,Math.min(upgradeMax(k,shopIndex),Number(s.upgrades[k])||0))])):{}})):[];
  if(ns.length){shops.length=0;ns.forEach(s=>shops.push(s))}
  coins=+d.coins||0;corners=+d.corners||0;
  if(d.P&&typeof d.P==='object'){['points','spent','claimedScore','lifetimeEarned','runEarned','prestiges','bestShop'].forEach(k=>{if(Number.isFinite(+d.P[k]))prestigeData[k]=Math.max(0,+d.P[k])});if(d.P.skills&&typeof d.P.skills==='object')SKILLS.forEach(sk=>{prestigeData.skills[sk.id]=Math.max(0,Math.min(sk.max,+d.P.skills[sk.id]||0))})}else prestigeData.bestShop=Math.max(prestigeData.bestShop,shops.length-1);
  if(d.S&&typeof d.S==='object'){
   Object.keys(shopState).forEach(k=>{if(k!=='un'&&!Object.prototype.hasOwnProperty.call(UPGRADE_MAX,k)&&typeof d.S[k]==='number')shopState[k]=d.S[k]});
   shopState.un=Array.isArray(d.S.un)?d.S.un.map(Boolean):[true];shopState.un[0]=true;
   const hasShopUpgradeData=ns.some(x=>Object.keys(x.upgrades||{}).length>0);
   if(!hasShopUpgradeData)Object.keys(UPGRADE_MAX).forEach(k=>{shops[0].upgrades[k]=Math.max(0,Math.min(upgradeMax(k,0),Number(d.S[k])||0))});
  }
  currentShop=Math.max(0,Math.min(shops.length-1,d.sc|0));shops.forEach(sh=>{sh.people=sh.people||makePeople()});currentTVs=shops[currentShop].tvs;people=shops[currentShop].people;prestigeData.bestShop=Math.max(prestigeData.bestShop,shops.length-1);
  if(Array.isArray(d.badge))d.badge.forEach((b,i)=>{if(i<badge.length)badge[i]=!!b});
  if(Array.isArray(d.seen))d.seen.forEach((v,i)=>{if(v&&UPGRADES[i])UPGRADES[i].seen=true});
  displayCoins=coins}catch(e){}}
